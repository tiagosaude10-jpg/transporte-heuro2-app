<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a4ea3">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Solicitação de Transporte — HEURO</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef4fb;color:#17365f}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .page{min-height:100vh;background:linear-gradient(180deg,#0b4b98 0,#1973c8 210px,#eef4fb 210px);padding:18px 14px 32px}.top{max-width:720px;margin:auto;color:#fff;display:flex;align-items:center;gap:12px;padding:4px 2px 18px}.back{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:12px;min-width:48px;height:44px;font-size:24px}.top h1{font-size:1.25rem;margin:0}.top p{margin:3px 0 0;font-size:.9rem;opacity:.9}
    .card{max-width:720px;margin:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 16px 40px rgba(16,54,105,.16);overflow:hidden}.grid{display:grid;gap:15px;min-width:0}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-width:0}.row>*{min-width:0}label{display:grid;gap:7px;min-width:0;font-weight:750;font-size:.92rem}input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;height:48px;border:1px solid #c7d7eb;border-radius:12px;padding:0 14px;font:inherit;color:#18395f;background:#fff;outline:none}textarea{height:auto;min-height:96px;padding:13px 14px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#1474cf;box-shadow:0 0 0 3px rgba(20,116,207,.13)}
    .smart-field{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;width:100%;height:48px;border:1px solid #c7d7eb;border-radius:12px;background:#fff;overflow:hidden}.smart-field:focus-within{border-color:#1474cf;box-shadow:0 0 0 3px rgba(20,116,207,.13)}.smart-field .manual{height:46px;border:0;border-radius:0;box-shadow:none!important;padding:0 12px;font-size:16px}.smart-field button{height:46px;border:0;border-left:1px solid #d9e4f1;background:#eef6ff;display:grid;place-items:center;font-size:21px}.smart-field .clear-button{color:#a52626;background:#fff4f4;font-size:18px;font-weight:900}.native-picker{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;left:-9999px!important}.check{display:flex;align-items:center;gap:10px;background:#f5f9fe;border:1px solid #d8e5f4;border-radius:12px;padding:12px}.check input{width:22px;height:22px}.hint{font-size:.8rem;color:#617a9b;font-weight:500}.hidden{display:none!important}
    .native-attachment{height:auto;min-height:52px;padding:8px;border:1px solid #c7d7eb;border-radius:12px;background:#f7faff;color:#174d8c;font-weight:700}.native-attachment::file-selector-button,.native-attachment::-webkit-file-upload-button{min-height:38px;margin-right:10px;border:0;border-radius:10px;padding:0 14px;background:#0a55c4;color:#fff;font:inherit;font-weight:800}.attachment-summary{min-height:20px;font-size:.82rem;color:#617a9b;font-weight:600}.clear-attachments{justify-self:start;border:0;background:transparent;color:#a52626;font-weight:900;text-decoration:underline;padding:0}.actions,.post-actions{display:grid;gap:10px;margin-top:8px}.primary,.secondary,.pdf-button,.whatsapp-button{min-height:52px;border:0;border-radius:14px;font-weight:850;font-size:1rem}.primary{background:#0a55c4;color:#fff}.secondary{background:#e7f0fb;color:#174d8c}.pdf-button{background:#6b3fc8;color:#fff}.whatsapp-button{background:#159447;color:#fff}.message{display:none;margin-top:14px;padding:12px;border-radius:12px;font-weight:700}.message.ok{display:block;background:#e7f8ee;color:#17663a}.message.error{display:block;background:#fdecec;color:#982525}
    @media(max-width:560px){.row{grid-template-columns:1fr}.card{padding:17px}.page{padding-left:10px;padding-right:10px}}
  </style>
</head>
<body>
<main class="page">
  <header class="top"><button class="back" type="button" onclick="history.back()" aria-label="Voltar">‹</button><div><h1>Solicitação de Transporte</h1><p>Preencha os dados para encaminhar à equipe de transporte.</p></div></header>
  <form id="transportForm" class="card" novalidate><div class="grid">
    <label>Nome do paciente<input id="patientName" required autocomplete="off"></label>
    <label>Data de nascimento<div class="smart-field"><input id="birthDateText" class="manual" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" required><button class="picker-button" type="button" data-picker="birthDateNative">📅</button><button class="clear-button" type="button" data-clear="birthDateText,birthDateNative">×</button></div><input id="birthDateNative" class="native-picker" type="date"></label>
    <label>Tipo de transporte<select id="supportType" name="supportType" required><option value="">Selecione o tipo de transporte</option><option value="basico">Suporte Básico</option><option value="avancado_uti">Suporte Avançado / UTI</option></select></label>
    <label>Prioridade<select id="priority" name="priority" required><option value="">Selecione a prioridade</option><option value="emergencia">Emergência</option><option value="urgencia">Urgência</option><option value="eletivo">Eletivo</option></select><span class="hint">Ordem da fila: Emergência, Urgência e Eletivo.</span></label>
    <label>Setor de origem<select id="originSector" required><option value="">Selecione</option><option>UTI</option><option>Sala Vermelha</option><option>Clínica Geral</option><option>Clínica Médica</option><option>Clínica Cirúrgica</option><option>Clínica Ortopédica</option><option>Centro Cirúrgico</option><option>Oncologia</option><option>Outro</option></select></label>
    <label id="originLocationLabel">Enfermaria / Leito<input id="originLocation"></label>
    <label>Destino<input id="destination" required placeholder="Informe o local de destino"></label>
    <div class="row"><label>Data do transporte<div class="smart-field"><input id="transportDateText" class="manual" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" required><button class="picker-button" type="button" data-picker="transportDateNative">📅</button><button class="clear-button" type="button" data-clear="transportDateText,transportDateNative">×</button></div><input id="transportDateNative" class="native-picker" type="date"></label><label>Horário do destino<div class="smart-field"><input id="destinationTimeText" class="manual" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" required><button class="picker-button" type="button" data-picker="destinationTimeNative">🕒</button><button class="clear-button" type="button" data-clear="destinationTimeText,destinationTimeNative">×</button></div><input id="destinationTimeNative" class="native-picker" type="time"></label></div>
    <label class="check"><input id="oxygenRequired" type="checkbox"><span>Paciente necessita de oxigênio</span></label>
    <label id="oxygenDetailsLabel" class="hidden">Detalhes do oxigênio<input id="oxygenDetails" placeholder="Ex.: cateter 2 L/min"></label>
    <label>Motivo da transferência<select id="transferReason" required><option value="">Selecione o motivo</option><option value="transferencia">Transferência</option><option value="exame_procedimento">Exame para procedimento</option><option value="consulta">Consulta</option></select></label>
    <label>Observações<textarea id="observations" placeholder="Informações clínicas ou operacionais importantes"></textarea></label>
    <label>Foto ou Documento<input id="attachments" class="native-attachment" type="file" accept="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.txt" multiple><span id="attachmentSummary" class="attachment-summary">Nenhum arquivo selecionado.</span><button id="clearAttachments" class="clear-attachments hidden" type="button">Limpar anexos</button><span class="hint">Até 10 MB por arquivo.</span></label>
    <div class="actions"><button id="submitButton" class="primary" type="submit">Enviar solicitação</button><button class="secondary" type="button" onclick="location.href='./comando.html'">Voltar à tela de comando</button></div>
    <div id="formMessage" class="message" role="status"></div>
    <div id="postActions" class="post-actions hidden"><button id="sharePdfButton" class="pdf-button" type="button">Gerar / Compartilhar PDF</button><button id="openWhatsappButton" class="whatsapp-button" type="button">Abrir WhatsApp do transporte</button></div>
  </div></form>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="js/config.js?v=20260806.34"></script><script src="js/solicitar-transporte.js?v=20260806.34" defer></script>
</body></html>
