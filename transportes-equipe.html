<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Transportes da Equipe — HEURO</title>
<link rel="stylesheet" href="css/transportes-equipe.css?v=20260806.69">
<style>
html,body{width:100%;max-width:100%;overflow-x:hidden}.page,.workspace{width:100%;max-width:100%}.overview-panel,.category-panel{width:100%;max-width:860px;margin:auto}.category-panel[hidden],.overview-panel[hidden]{display:none!important}
.status-cards{margin:14px 0 0;display:grid;gap:12px}.status-card{width:100%;min-height:106px;border:1px solid #dce7f4;border-radius:22px;background:#fff;padding:12px;box-shadow:0 8px 20px rgba(30,65,112,.09);text-align:left}.status-card__title{display:grid;place-items:center;min-height:54px;padding:10px 16px;border-radius:16px;color:#fff;font-size:clamp(1rem,4vw,1.28rem);font-weight:850;line-height:1.15;text-align:center}.status-card__description{display:block;padding:10px 5px 2px;color:#687d9e;font-size:clamp(.86rem,3.3vw,1rem);font-weight:600;line-height:1.3}.status-card[data-tab="pending"] .status-card__title{background:#c92f3e}.status-card[data-tab="active"] .status-card__title{background:#267d4d}.status-card[data-tab="completed"] .status-card__title{background:#2768c7}
.category-search-note{display:none;margin:0 0 12px;padding:10px 13px;border-radius:13px;background:#fff1f2;color:#962332;font-size:.86rem;font-weight:750}.category-search-note.show{display:block}
.workspace.pending-view{height:100dvh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:0;background:#f4f7fc!important;background-image:none!important}.workspace.pending-view>.top{position:relative;flex:0 0 auto;width:100%;max-width:none;margin:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;z-index:10;background:linear-gradient(145deg,#d43a49,#a8172a)!important;background-image:linear-gradient(145deg,#d43a49,#a8172a)!important;box-shadow:0 5px 16px rgba(91,14,25,.22);border-radius:0}.workspace.pending-view>.top .back{background:#fff!important;color:#b92333!important;border-color:#fff!important}.workspace.pending-view>.top h1,.workspace.pending-view>.top p{color:#fff!important}.workspace.pending-view .category-panel{flex:1 1 auto;min-height:0;width:100%;max-width:none;margin:0;padding:0;background:#f4f7fc!important;background-image:none!important;display:flex;flex-direction:column;overflow:hidden}.workspace.pending-view .category-heading{position:relative;flex:0 0 auto;width:100%;display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;margin:0;padding:10px 12px 12px;z-index:9;background:linear-gradient(180deg,#b92333,#c73543)!important;background-image:linear-gradient(180deg,#b92333,#c73543)!important;box-shadow:0 4px 12px rgba(91,14,25,.16)}.workspace.pending-view .category-back{width:54px;height:58px;border:0;border-radius:16px;background:#fff;color:#b92333;font-size:1.75rem;font-weight:900}.workspace.pending-view .category-copy{min-width:0;padding:9px 13px;border-radius:16px;background:#fff}.workspace.pending-view .category-copy h2{margin:0;color:#a51f30;font-size:1.08rem;line-height:1.18}.workspace.pending-view .category-copy p{margin:4px 0 0;color:#8a6469;font-size:.78rem;line-height:1.25}.workspace.pending-view .category-search-note{flex:0 0 auto;margin:10px 10px 0}.workspace.pending-view .list{flex:1 1 auto;min-height:0;width:100%;max-width:100%;margin:0;padding:14px 10px 24px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#f4f7fc!important;background-image:none!important}.workspace.pending-view .transport-table-section{margin:0 0 18px}.workspace.pending-view .table-section-heading{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:0 4px 9px}.workspace.pending-view .table-section-heading h3{margin:0;color:#a51f30;font-size:1.05rem}.workspace.pending-view .table-section-heading p{grid-column:1/-1;margin:0;color:#8d6b70;font-size:.82rem;font-weight:600}.workspace.pending-view .table-section-heading span{display:grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#fde8ea;color:#a92331;font-weight:900}.workspace.pending-view .accepted-section .table-section-heading span{background:#e3f5e9;color:#187343}.workspace.pending-view .table-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border:1px solid #d5e1f0;border-radius:16px;background:#fff;box-shadow:0 6px 16px rgba(25,60,110,.06)}.workspace.pending-view .transport-table{width:100%;min-width:660px;border-collapse:collapse}.workspace.pending-view .transport-table th{padding:13px 12px;background:#fbe9eb;color:#7f1e2b;font-size:.84rem;text-align:left}.workspace.pending-view .transport-table td{padding:13px 12px;border-top:1px solid #e4ebf4;color:#19365f;vertical-align:middle}.workspace.pending-view .table-status.waiting{background:#fde8ea;color:#a92331}.workspace.pending-view .table-status.accepted{background:#e3f5e9;color:#187343}.table-actions{display:flex;gap:7px;flex-wrap:wrap}.compact{min-height:38px!important;padding:8px 11px!important;border-radius:11px!important;font-size:.8rem!important}
@media(min-width:700px){.status-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.status-cards{gap:10px}.status-card{min-height:98px;border-radius:19px;padding:10px}.status-card__title{min-height:50px;border-radius:14px}.status-card__description{padding-top:8px}.workspace.pending-view>.top{padding-left:12px;padding-right:12px}.workspace.pending-view .category-heading{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<main class="page"><section id="workspace" class="workspace">
<header id="mainTop" class="top"><a class="back" href="./comando.html?v=20260806.69" aria-label="Voltar à tela de comando">←</a><div><h1>Transportes da Equipe</h1><p>Aceite, acompanhe e conclua os transportes.</p></div></header>
<section id="overviewPanel" class="overview-panel">
<section class="metrics"><article class="metric"><span>Pendentes</span><strong id="pendingCount">0</strong></article><article class="metric"><span>Aceitos / em andamento</span><strong id="activeCount">0</strong></article><article class="metric"><span>Concluídos</span><strong id="completedCount">0</strong></article></section>
<section class="toolbar"><input id="searchInput" class="search" type="search" placeholder="Pesquisar paciente ou protocolo"><button id="refreshButton" class="refresh" type="button" aria-label="Atualizar">↻</button></section>
<nav class="status-cards" aria-label="Categorias dos transportes">
<button class="tab status-card" data-tab="pending" type="button"><span class="status-card__title">Transportes pendentes</span><span class="status-card__description">Aceitos acima e aguardando aceite abaixo.</span></button>
<button class="tab status-card" data-tab="active" type="button"><span class="status-card__title">Transportes aceitos</span><span class="status-card__description">Transportes aceitos ou atualmente em execução.</span></button>
<button class="tab status-card" data-tab="completed" type="button"><span class="status-card__title">Transportes concluídos</span><span class="status-card__description">Consulte os transportes já finalizados.</span></button>
</nav>
</section>
<section id="categoryPanel" class="category-panel" hidden>
<header id="categoryHeading" class="category-heading"><button id="categoryBack" class="category-back" type="button" aria-label="Voltar às categorias">←</button><div class="category-copy"><h2 id="categoryTitle">Transportes pendentes</h2><p id="categorySubtitle">Aceitos acima e aguardando aceite abaixo.</p></div></header>
<p id="categorySearchNote" class="category-search-note">Resultados encontrados em todos os status.</p>
<section id="requestList" class="list"><div class="empty">Carregando transportes...</div></section>
</section>
</section></main>
<div id="actionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="sheet"><h2 id="modalTitle">Transporte</h2><p id="modalSubtitle" class="protocol"></p><div id="modalContent"></div><div class="sheet-actions"><button id="modalCancel" class="cancel" type="button">Cancelar</button><button id="modalConfirm" class="confirm" type="button">Confirmar</button></div></section></div>
<script src="js/config.js?v=20260806.69"></script>
<script src="js/transportes-equipe.js?v=20260806.69" defer></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const workspace=document.getElementById('workspace'),overview=document.getElementById('overviewPanel'),category=document.getElementById('categoryPanel'),search=document.getElementById('searchInput'),title=document.getElementById('categoryTitle'),subtitle=document.getElementById('categorySubtitle'),note=document.getElementById('categorySearchNote');
 const labels={pending:['Transportes pendentes','Aceitos acima e aguardando aceite abaixo.'],active:['Transportes aceitos','Transportes aceitos ou atualmente em execução.'],completed:['Transportes concluídos','Transportes já finalizados.']};
 const openCategory=(tab,searchMode=false)=>{overview.hidden=true;category.hidden=false;workspace.classList.toggle('pending-view',tab==='pending'||searchMode);if(searchMode){title.textContent='Resultado da pesquisa';subtitle.textContent='Paciente ou protocolo localizado no sistema.';note.classList.add('show')}else{title.textContent=labels[tab][0];subtitle.textContent=labels[tab][1];note.classList.remove('show')}window.scrollTo({top:0,left:0,behavior:'instant'})};
 document.querySelectorAll('.status-card').forEach(button=>button.addEventListener('click',()=>openCategory(button.dataset.tab)));
 document.getElementById('categoryBack').addEventListener('click',()=>{workspace.classList.remove('pending-view');category.hidden=true;overview.hidden=false;search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));window.scrollTo({top:0,left:0,behavior:'instant'})});
 search.addEventListener('input',()=>{if(search.value.trim())openCategory('pending',true)});
});
</script>
</body></html>
