        <button class="status-card status-card-active" data-tab="active" type="button">

              <defs>

          </span>
          <span><strong>Transportes aceitos</strong><small>Aceitos ou em execução.</small></span>
          <span class="status-card-arrow">›</span>
        </button>
        <button class="status-card status-card-completed" data-tab="completed" type="button">
          <span class="status-card-icon" aria-hidden="true">

            <div id="categoryCounter" class="category-counter"><strong>0</strong><span>Pendentes</span></div>
          </div>
        </div>
      </header>

      <section class="category-content">
        <p id="categorySearchNote" class="category-search-note" hidden>Resultado da pesquisa em todos os status.</p>

    <section class="sheet">
      <h2 id="modalTitle">Transporte</h2>
      <p id="modalSubtitle" class="protocol"></p>
      <div id="modalContent"></div>
      <div class="sheet-actions">
        <button id="modalCancel" class="cancel" type="button">Cancelar</button>
        <button id="modalConfirm" class="confirm" type="button">Confirmar</button>
      </div>
    </section>
  </div>

  <script src="js/config.js?v=20260807.80"></script>
