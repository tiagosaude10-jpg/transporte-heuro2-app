<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073d9d">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">

<title>Transportes da Equipe — HEURO</title>
<link rel="stylesheet" href="css/transportes-equipe.css?v=20260806.65">
<style>
.overview-panel{max-width:860px;margin:auto}.status-cards{margin:14px 0 0;display:grid;gap:12px}.status-card{width:100%;min-height:106px;border:1px solid #dce7f4;border-radius:22px;background:#fff;padding:12px;box-shadow:0 8px 20px rgba(30,65,112,.09);text-align:left;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}.status-card__title{display:grid;place-items:center;min-height:54px;padding:10px 16px;border-radius:16px;color:#fff;font-size:clamp(1rem,4vw,1.28rem);font-weight:850;line-height:1.15;text-align:center}.status-card__description{display:block;padding:10px 5px 2px;color:#687d9e;font-size:clamp(.86rem,3.3vw,1rem);font-weight:600;line-height:1.3}.status-card[data-tab="pending"] .status-card__title{background:linear-gradient(135deg,#d63b47,#b92534)}.status-card[data-tab="active"] .status-card__title{background:linear-gradient(135deg,#2c9259,#1c7045)}.status-card[data-tab="completed"] .status-card__title{background:linear-gradient(135deg,#2c76d2,#1558b2)}.status-card:active{transform:scale(.986);filter:brightness(1.035);box-shadow:0 6px 16px rgba(30,65,112,.14)}.category-panel{max-width:860px;margin:auto}.category-panel[hidden],.overview-panel[hidden]{display:none!important}.category-heading{display:flex;align-items:center;gap:12px;margin:0 0 14px}.category-back{display:grid;place-items:center;flex:0 0 48px;height:48px;border:0;border-radius:14px;background:#e6eef9;color:#164c91;font-size:1.6rem;font-weight:900}.category-copy h2{margin:0;color:#123a78;font-size:1.28rem}.category-copy p{margin:3px 0 0;color:#7183a0;font-size:.9rem}.category-search-note{display:none;margin:0 0 12px;padding:10px 13px;border-radius:13px;background:#eaf2fc;color:#315d94;font-size:.86rem;font-weight:750}.category-search-note.show{display:block}
.transport-table-section{margin:0 0 18px}.table-section-heading{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:0 0 9px}.table-section-heading h3{margin:0;color:#123f7e;font-size:1.05rem}.table-section-heading span{display:grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#e7eef9;color:#164d92;font-weight:900}.table-section-heading p{grid-column:1/-1;margin:0;color:#7587a3;font-size:.82rem;font-weight:600}.accepted-section .table-section-heading span{background:#e3f5e9;color:#187343}.waiting-section .table-section-heading span{background:#fde8ea;color:#a92331}.table-scroll{overflow-x:auto;border:1px solid #d5e1f0;border-radius:18px;background:#fff;box-shadow:0 6px 16px rgba(25,60,110,.06)}.transport-table{width:100%;min-width:660px;border-collapse:collapse}.transport-table th{padding:13px 12px;background:#eaf2fc;color:#173d74;font-size:.84rem;text-align:left}.transport-table td{padding:13px 12px;border-top:1px solid #e4ebf4;color:#19365f;vertical-align:middle}.transport-table td strong{display:block;font-size:.92rem}.transport-table td small{display:block;margin-top:3px;color:#7385a2;font-size:.77rem}.table-status{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:.78rem;font-weight:850;white-space:nowrap}.table-status.accepted{background:#e3f5e9;color:#187343}.table-status.waiting{background:#fde8ea;color:#a92331}.table-actions{display:flex;gap:7px;flex-wrap:wrap}.compact{min-height:38px!important;padding:8px 11px!important;border-radius:11px!important;font-size:.8rem!important}.compact-empty{padding:16px!important}.row-accepted{background:#fbfffc}
@media(min-width:700px){.status-cards{grid-template-columns:repeat(3,1fr)}.status-card{min-height:136px}}
@media(max-width:560px){.status-cards{gap:10px}.status-card{min-height:98px;border-radius:19px;padding:10px}.status-card__title{min-height:50px;border-radius:14px}.status-card__description{padding-top:8px}.metrics{margin-bottom:12px}.table-scroll{border-radius:16px}}
</style>
</head>
<body>
<main class="page"><section class="workspace">
<header class="top"><a class="back" href="./comando.html?v=20260806.65" aria-label="Voltar à tela de comando">←</a><div><h1>Transportes da Equipe</h1><p>Aceite, acompanhe e conclua os transportes.</p></div></header>
<section id="overviewPanel" class="overview-panel">
<section class="metrics"><article class="metric"><span>Pendentes</span><strong id="pendingCount">0</strong></article><article class="metric"><span>Aceitos / em andamento</span><strong id="activeCount">0</strong></article><article class="metric"><span>Concluídos</span><strong id="completedCount">0</strong></article></section>
<section class="toolbar"><input id="searchInput" class="search" type="search" placeholder="Pesquisar paciente ou protocolo"><button id="refreshButton" class="refresh" type="button" aria-label="Atualizar">↻</button></section>
<nav class="status-cards" aria-label="Categorias dos transportes">
<button class="tab status-card" data-tab="pending" type="button"><span class="status-card__title">Transportes pendentes</span><span class="status-card__description">Aceitos acima e aguardando aceite abaixo.</span></button>
<button class="tab status-card" data-tab="active" type="button"><span class="status-card__title">Transportes aceitos</span><span class="status-card__description">Transportes aceitos ou atualmente em execução.</span></button>
<button class="tab status-card" data-tab="completed" type="button"><span class="status-card__title">Transportes concluídos</span><span class="status-card__description">Consulte os transportes já finalizados.</span></button>
</nav>
</section>
<section id="categoryPanel" class="category-panel" hidden>
<header class="category-heading"><button id="categoryBack" class="category-back" type="button" aria-label="Voltar às categorias">←</button><div class="category-copy"><h2 id="categoryTitle">Transportes pendentes</h2><p id="categorySubtitle">Aceitos acima e aguardando aceite abaixo.</p></div></header>
<p id="categorySearchNote" class="category-search-note">Resultados encontrados em todos os status.</p>
<section id="requestList" class="list"><div class="empty">Carregando transportes...</div></section>
</section>
</section></main>
<div id="actionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="sheet"><h2 id="modalTitle">Transporte</h2><p id="modalSubtitle" class="protocol"></p><div id="modalContent"></div><div class="sheet-actions"><button id="modalCancel" class="cancel" type="button">Cancelar</button><button id="modalConfirm" class="confirm" type="button">Confirmar</button></div></section></div>
<script src="js/config.js?v=20260806.65"></script>
<script src="js/transportes-equipe.js?v=20260806.65" defer></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const overview=document.getElementById('overviewPanel'),category=document.getElementById('categoryPanel'),search=document.getElementById('searchInput'),title=document.getElementById('categoryTitle'),subtitle=document.getElementById('categorySubtitle'),note=document.getElementById('categorySearchNote');
 const labels={pending:['Transportes pendentes','Aceitos acima e aguardando aceite abaixo.'],active:['Transportes aceitos','Transportes aceitos ou atualmente em execução.'],completed:['Transportes concluídos','Transportes já finalizados.']};
 const openCategory=(tab,searchMode=false)=>{overview.hidden=true;category.hidden=false;if(searchMode){title.textContent='Resultado da pesquisa';subtitle.textContent='Paciente ou protocolo localizado no sistema.';note.classList.add('show');}else{title.textContent=labels[tab][0];subtitle.textContent=labels[tab][1];note.classList.remove('show');}window.scrollTo({top:0,behavior:'instant'});};
 document.querySelectorAll('.status-card').forEach(button=>button.addEventListener('click',()=>openCategory(button.dataset.tab)));
 document.getElementById('categoryBack').addEventListener('click',()=>{category.hidden=true;overview.hidden=false;search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));window.scrollTo({top:0,behavior:'instant'});});
 search.addEventListener('input',()=>{if(search.value.trim())openCategory('pending',true);});
});
</script>
</body></html>
