<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="stylesheet" href="css/style.css?v=20260806.1">
  <style>
    .welcome-screen__button{overflow:visible!important;z-index:10;touch-action:manipulation}
    .welcome-screen__button .press-feedback{position:absolute;inset:-4px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .08s ease,transform .08s ease;background:rgba(20,105,235,.34);border:3px solid #075bd8;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 24px rgba(0,87,220,.72),inset 0 0 14px rgba(255,255,255,.45);transform:scale(1.02)}
    .welcome-screen__button.is-pressed .press-feedback{opacity:1;transform:scale(.985)}
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="app-screen welcome-screen" aria-label="Tela inicial do Transporte HEURO">
      <img class="app-screen__image" src="99BD9DA5-6979-422A-99EB-B41F091CC5FE.png?v=20260806.1" alt="Transporte HEURO — Agendamentos e Operações">
      <a id="welcomeEnterButton" class="hotspot welcome-screen__button" href="login.html" aria-label="Entrar no Transporte HEURO"><span class="press-feedback" aria-hidden="true"></span></a>
    </section>
  </main>
  <script src="js/config.js?v=20260806.1"></script>
  <script>
    (()=>{
      const button=document.getElementById('welcomeEnterButton');
      if(!button)return;
      const press=()=>button.classList.add('is-pressed');
      button.addEventListener('pointerdown',press,{passive:true});
      button.addEventListener('touchstart',press,{passive:true});
      button.addEventListener('click',(event)=>{
        event.preventDefault();
        press();
        setTimeout(()=>window.location.assign(button.href),180);
      });
      window.HEURO?.clearLegacyCaches();
    })();
  </script>
</body>
</html>
