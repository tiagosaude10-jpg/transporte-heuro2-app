<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06328d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Recuperar senha — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#06328d,#0b5ed7);font-family:system-ui,-apple-system,Arial,sans-serif;color:#102d68;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
    .page{max-width:520px;margin:0 auto;padding:34px 0}.card{background:#fff;border-radius:28px;padding:26px;box-shadow:0 18px 45px rgba(0,0,0,.2)}
    .logo{width:86px;height:86px;border-radius:22px;display:block;margin:0 auto 14px}.kicker{text-align:center;color:#1165c8;font-weight:800;letter-spacing:.12em;margin:0 0 6px}.card h1{text-align:center;margin:0 0 10px;font-size:30px}.intro{text-align:center;color:#5e6f91;line-height:1.45;margin:0 0 24px}
    label{display:block;font-weight:800;margin-bottom:8px}input{width:100%;height:56px;border:2px solid #b9c8e3;border-radius:16px;padding:0 16px;font-size:17px;color:#183b82;outline:none}input:focus{border-color:#0b63ce;box-shadow:0 0 0 4px rgba(11,99,206,.12)}
    button{width:100%;height:58px;border:0;border-radius:17px;background:#1265cc;color:#fff;font-size:18px;font-weight:800;margin-top:18px;cursor:pointer}button:disabled{opacity:.65}.message{display:none;margin:18px 0 0;padding:14px;border-radius:14px;text-align:center;font-weight:700;line-height:1.35}.message.error{display:block;background:#fff0f0;color:#a52a2a}.message.success{display:block;background:#e9f8ef;color:#13763c}.back{display:block;text-align:center;margin-top:18px;color:#1555a6;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <img class="logo" src="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png" alt="HEURO Transportes">
      <p class="kicker">HEURO TRANSPORTES</p>
      <h1>Recuperar senha</h1>
      <p class="intro">Informe o e-mail usado no cadastro. Enviaremos um link seguro para você criar uma nova senha.</p>
      <form id="recoveryForm" novalidate>
        <label for="recoveryEmail">E-mail cadastrado</label>
        <input id="recoveryEmail" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
        <button id="recoverySubmit" type="submit">Enviar link de recuperação</button>
      </form>
      <p id="recoveryMessage" class="message" role="alert"></p>
      <a class="back" href="login.html">Voltar ao login</a>
    </section>
  </main>
  <script src="js/config.js?v=20260806.3"></script>
  <script src="js/recuperar-senha.js?v=20260806.3" defer></script>
</body>
</html>
