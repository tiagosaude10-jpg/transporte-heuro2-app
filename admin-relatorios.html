<script>
(() => {
'use strict';
const app=window.HEURO,session=app?.readSession?.();
if(!session?.access_token||session.access!=='administrador_geral'){location.replace('./comando.html?motivo=sem_permissao_admin');return;}
const auth=()=>app.authenticatedHeaders(session.access_token),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const labels={pendente:'Pendente',aceito:'Aceito',concluido:'Concluído',cancelado:'Cancelado',suspenso:'Suspenso',recusado:'Recusado',emergencia:'Emergência',urgencia:'Urgência',eletivo:'Eletivo',basico:'Suporte Básico',avancado_uti:'Suporte Avançado / UTI'};
const terminal=new Set(['concluido','cancelado','suspenso','recusado']);
let requests=[],archives=[],filtered=[],tab='historico',archiveReady=null;
const executionOf=r=>Array.isArray(r.transport_executions)?r.transport_executions[0]:r.transport_executions;
const eventsOf=r=>Array.isArray(r.transport_execution_events)?r.transport_execution_events:[];
const statusOf=r=>norm(executionOf(r)?.status||r.status);
const localDate=v=>v?new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Porto_Velho'}).format(new Date(v)):'—';
const dateTime=v=>v?new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Porto_Velho',dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
const minutes=(a,b)=>a&&b?Math.max(0,(new Date(b)-new Date(a))/60000):null;
const duration=value=>value==null?'—':value<60?Math.round(value)+' min':(value/60).toFixed(1).replace('.',',')+' h';
const completedBy=r=>eventsOf(r).filter(e=>norm(e.new_status)==='concluido').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]?.actor_name||'—';
async function fetchJson(path,options={}){const res=await fetch(app.apiUrl(path),{...options,headers:{...auth(),...(options.headers||{})}});const data=await res.json().catch(()=>null);if(!res.ok)throw new Error(data?.message||data?.details||'Falha ao carregar dados.');return data}
function isoLocal(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function setDefaults(){const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1);$('dateStart').value=isoLocal(first);$('dateEnd').value=isoLocal(now)}
function applyFilters(){
 const start=$('dateStart').value?new Date($('dateStart').value+'T00:00:00-04:00'):null,end=$('dateEnd').value?new Date($('dateEnd').value+'T23:59:59-04:00'):null;
 const status=$('statusFilter').value,priority=$('priorityFilter').value,sector=$('sectorFilter').value,professional=$('professionalFilter').value,text=norm($('textFilter').value);
 filtered=requests.filter(r=>{const created=new Date(r.created_at),e=executionOf(r),hay=norm([r.patient_name,r.protocol,r.destination].join(' '));return(!start||created>=start)&&(!end||created<=end)&&(status==='all'||statusOf(r)===status)&&(priority==='all'||r.priority===priority)&&(sector==='all'||r.origin_sector===sector)&&(professional==='all'||e?.responsible_name===professional)&&(!text||hay.includes(text))});
 archiveReady=null;render();
}
function avg(values){const ok=values.filter(v=>v!=null);return ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null}
function scheduledAt(r){if(!r.transport_date||!r.destination_time)return null;const d=new Date(r.transport_date+'T'+String(r.destination_time).slice(0,5)+':00-04:00');return Number.isNaN(d.getTime())?null:d}
function isDelayed(r){const scheduled=scheduledAt(r);if(!scheduled)return false;const e=executionOf(r),reference=e?.accepted_at?new Date(e.accepted_at):new Date();return reference>scheduled&&!['cancelado','recusado'].includes(statusOf(r))}
function updateCards(){const done=filtered.filter(r=>statusOf(r)==='concluido'),cancel=filtered.filter(r=>['cancelado','recusado'].includes(statusOf(r)));$('totalCard').textContent=filtered.length;$('doneCard').textContent=done.length;$('cancelCard').textContent=cancel.length;$('acceptTimeCard').textContent=duration(avg(filtered.map(r=>minutes(r.created_at,executionOf(r)?.accepted_at))));$('executionTimeCard').textContent=duration(avg(done.map(r=>minutes(executionOf(r)?.accepted_at,executionOf(r)?.completed_at))));$('delayCard').textContent=filtered.filter(isDelayed).length;$('oxygenCard').textContent=filtered.filter(r=>r.oxygen_required).length;$('attachmentCard').textContent=filtered.filter(r=>(r.attachment_paths||[]).length).length}
function statusBadge(r){const s=statusOf(r);return '<span class="status '+esc(s)+'">'+esc(labels[s]||s)+'</span>'}
function timeline(r){return eventsOf(r).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(e=>dateTime(e.created_at)+' — '+(labels[norm(e.new_status)]||e.new_status||e.event_type)+' por '+e.actor_name+(e.notes?' ('+e.notes+')':'')).join(' | ')||'—'}
function historyTable(data){
 if(!data.length)return '<div class="empty">Nenhum transporte encontrado no período.</div>';
 return '<div class="scroll"><table class="table"><thead><tr><th>Paciente</th><th>Protocolo</th><th>Situação</th><th>Origem</th><th>Destino</th><th>Solicitação</th><th>Aceite</th><th>Conclusão</th><th>Quem aceitou</th><th>Quem concluiu</th><th>Motivo/observação</th><th>Atrasado</th><th>Histórico de alterações</th><th>Arquivo</th></tr></thead><tbody>'+data.map(r=>{const e=executionOf(r);return '<tr><td><b>'+esc(r.patient_name)+'</b></td><td>'+esc(r.protocol||'—')+'</td><td>'+statusBadge(r)+'</td><td>'+esc([r.origin_sector,r.origin_location].filter(Boolean).join(' — '))+'</td><td>'+esc(r.destination)+'</td><td>'+dateTime(r.created_at)+'</td><td>'+dateTime(e?.accepted_at)+'</td><td>'+dateTime(e?.completed_at)+'</td><td>'+esc(e?.responsible_name||'—')+'</td><td>'+esc(completedBy(r))+'</td><td>'+esc(e?.cancellation_reason||r.observations||'—')+'</td><td>'+(isDelayed(r)?'Sim':'Não')+'</td><td>'+esc(timeline(r))+'</td><td>'+esc(r.archive_file_name||'—')+'</td></tr>'}).join('')+'</tbody></table></div>'
}
function renderHistory(){$('historyPanel').innerHTML='<div class="section-head"><div><h2>Histórico dos transportes</h2><small>'+filtered.length+' registro(s) no filtro atual</small></div><div class="actions"><button class="action pdf" id="historyPdf">Gerar PDF</button></div></div>'+historyTable(filtered);$('historyPdf').onclick=()=>generateDataPdf(filtered,'Historico_Transportes_HEURO')}
function grouped(data,key){const m=new Map();data.forEach(r=>{const k=key(r)||'Não informado';m.set(k,(m.get(k)||0)+1)});return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function bars(title,rows){const max=Math.max(1,...rows.map(x=>x[1]));return '<div class="chart"><h3>'+esc(title)+'</h3>'+(rows.length?rows.map(([name,count])=>'<div class="bar"><span>'+esc(name)+'</span><span class="track"><span class="fill" style="width:'+Math.round(count/max*100)+'%"></span></span><b>'+count+'</b></div>').join(''):'<div class="empty">Sem dados</div>')+'</div>'}
function renderReports(){const byStatus=grouped(filtered,r=>labels[statusOf(r)]||statusOf(r)),bySector=grouped(filtered,r=>r.origin_sector),byPriority=grouped(filtered,r=>labels[r.priority]||r.priority),byProfessional=grouped(filtered,r=>executionOf(r)?.responsible_name),byDestination=grouped(filtered,r=>r.destination),bySupport=grouped(filtered,r=>labels[r.support_type]||r.support_type),byDay=grouped(filtered,r=>localDate(r.created_at)),byOxygen=grouped(filtered,r=>r.oxygen_required?'Com oxigênio':'Sem oxigênio'),byAttachments=grouped(filtered,r=>(r.attachment_paths||[]).length?'Com anexos':'Sem anexos'),byReason=grouped(filtered,r=>executionOf(r)?.cancellation_reason||'Sem motivo de encerramento');$('reportsPanel').innerHTML='<div class="section-head"><div><h2>Relatórios e indicadores</h2><small>Os cálculos usam somente o período e os filtros escolhidos.</small></div><div class="actions"><button class="action pdf" id="reportPdf">Gerar relatório em PDF</button></div></div><div class="charts">'+bars('Por situação',byStatus)+bars('Por dia',byDay)+bars('Por setor de origem',bySector)+bars('Por destino',byDestination)+bars('Por prioridade',byPriority)+bars('Por tipo de ambulância',bySupport)+bars('Por profissional que aceitou',byProfessional)+bars('Uso de oxigênio',byOxygen)+bars('Registros com anexos',byAttachments)+bars('Motivos de cancelamento, recusa ou suspensão',byReason)+'</div>';$('reportPdf').onclick=()=>generateDataPdf(filtered,'Relatorio_Indicadores_HEURO')}
function terminalFiltered(){return filtered.filter(r=>terminal.has(statusOf(r)))}
function renderArchivesLog(){return archives.length?'<div class="archive-log"><h3>Arquivamentos já registrados</h3>'+archives.slice(0,20).map(a=>'<div class="log"><b>'+esc(a.file_name)+'</b><br>'+localDate(a.created_at)+' · '+a.request_count+' transporte(s) · '+a.attachment_count+' anexo(s) removido(s) · por '+esc(a.created_by_name)+'</div>').join('')+'</div>':''}
function renderArchive(){const eligible=terminalFiltered(),attachments=eligible.reduce((n,r)=>n+(r.attachment_paths?.length||0),0);$('archivePanel').innerHTML='<div class="section-head"><div><h2>Arquivar e liberar espaço</h2><small>Somente transportes concluídos, cancelados, suspensos ou recusados.</small></div></div><div class="notice">O PDF definitivo será gerado com os dados e as imagens. Os registros leves permanecerão no Histórico e nos Relatórios. Apenas as imagens originais efetivamente incorporadas serão removidas após sua confirmação. Documentos PDF originais serão preservados.</div><p><b>'+eligible.length+'</b> transporte(s) e <b>'+attachments+'</b> anexo(s) estão elegíveis no filtro atual.</p><div class="actions"><button class="action pdf" id="generateArchive" '+(!eligible.length?'disabled':'')+'>1. Gerar PDF definitivo</button></div><label class="confirm"><input id="archiveConfirm" type="checkbox" disabled><span>Confirmo que o PDF foi gerado, aberto e salvo em local institucional seguro. Autorizo remover somente as imagens originais que foram incorporadas ao arquivo definitivo.</span></label><button class="action archive" id="purgeArchive" disabled>2. Arquivar e remover anexos</button><div id="archiveMessage"></div>'+renderArchivesLog();$('generateArchive').onclick=()=>generateArchivePdf(eligible);$('archiveConfirm').onchange=()=>{$('purgeArchive').disabled=!$('archiveConfirm').checked||!archiveReady};$('purgeArchive').onclick=finalizeArchive}
function showTab(name){tab=name;location.hash=name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('historyPanel').classList.toggle('hidden',name!=='historico');$('reportsPanel').classList.toggle('hidden',name!=='relatorios');$('archivePanel').classList.toggle('hidden',name!=='arquivar');render()}
function render(){updateCards();if(tab==='historico')renderHistory();else if(tab==='relatorios')renderReports();else renderArchive()}
async function ensurePdf(){await window.HEURO_PDF?.loadJsPdf?.();if(!window.jspdf?.jsPDF)throw new Error('Gerador de PDF indisponível.')}
function header(doc,title,subtitle){doc.setFillColor(7,61,157);doc.rect(0,0,210,24,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(title,105,10,{align:'center'});doc.setFontSize(8);doc.text(subtitle,105,17,{align:'center'});return 30}
function row(doc,y,label,value){const lines=doc.splitTextToSize(String(value??'—'),137);const h=Math.max(8,lines.length*4+4);if(y+h>284){doc.addPage();y=28}doc.setDrawColor(200,215,232);doc.setFillColor(242,247,253);doc.rect(12,y,40,h,'FD');doc.setFillColor(255);doc.rect(52,y,146,h,'FD');doc.setTextColor(20,63,112);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(label,15,y+5);doc.setFont('helvetica','normal');doc.setTextColor(35,53,75);doc.text(lines,55,y+5);return y+h}
function requestRows(r){const e=executionOf(r);return[['Paciente',r.patient_name],['Protocolo',r.protocol||'—'],['Situação',labels[statusOf(r)]||statusOf(r)],['Origem',[r.origin_sector,r.origin_location].filter(Boolean).join(' — ')],['Destino',r.destination],['Prioridade',labels[r.priority]||r.priority],['Ambulância',labels[r.support_type]||r.support_type],['Solicitado em',dateTime(r.created_at)],['Aceito em',dateTime(e?.accepted_at)],['Concluído em',dateTime(e?.completed_at)],['Solicitante',r.requester_name],['Quem aceitou',e?.responsible_name||'—'],['Quem concluiu',completedBy(r)],['Oxigênio',r.oxygen_required?(r.oxygen_details||'Sim'):'Não'],['Anexos disponíveis',(r.attachment_paths||[]).length],['Atrasado',isDelayed(r)?'Sim':'Não'],['Histórico de alterações',timeline(r)],['Motivo/observação',e?.cancellation_reason||r.observations||'—'],['Arquivo',r.archive_file_name||'—']]}
function finishPdf(doc,name){for(let p=1;p<=doc.getNumberOfPages();p++){doc.setPage(p);doc.setTextColor(95);doc.setFontSize(7);doc.text('Transporte HEURO 2 · Página '+p+' de '+doc.getNumberOfPages(),198,293,{align:'right'})}doc.save(name+'.pdf')}
async function generateDataPdf(data,name){try{await ensurePdf();const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',compress:true});if(!data.length)throw new Error('Não há registros para gerar o PDF.');for(let i=0;i<data.length;i++){if(i)doc.addPage();let y=header(doc,'TRANSPORTE HEURO — RELATÓRIO',data[i].patient_name+' · '+(data[i].protocol||'SEM PROTOCOLO'));requestRows(data[i]).forEach(([a,b])=>{y=row(doc,y,a,b)})}finishPdf(doc,name+'_'+new Date().toISOString().slice(0,10))}catch(e){alert(e.message)}}
const storagePath=p=>String(p||'').split('/').map(encodeURIComponent).join('/');
async function downloadAttachment(path){const res=await fetch(app.apiUrl('/storage/v1/object/authenticated/transport-attachments/'+storagePath(path)),{headers:auth(),cache:'no-store'});if(!res.ok)throw new Error('Falha ao baixar '+path.split('/').pop());return res.blob()}
async function pdfImage(blob){if(!String(blob.type).startsWith('image/'))return null;const url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);c.getContext('2d',{alpha:false}).drawImage(img,0,0,c.width,c.height);return{data:c.toDataURL('image/jpeg',.72),w:c.width,h:c.height}}finally{URL.revokeObjectURL(url)}}
async function generateArchivePdf(data){const panel=$('archivePanel');try{panel.classList.add('loading');await ensurePdf();const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4',compress:true});let bytes=0,attachments=0,deletablePaths=[];for(let i=0;i<data.length;i++){const r=data[i];if(i)doc.addPage();let y=header(doc,'ARQUIVO DEFINITIVO — TRANSPORTE HEURO',r.patient_name+' · '+(r.protocol||'SEM PROTOCOLO'));requestRows(r).forEach(([a,b])=>{y=row(doc,y,a,b)});for(const path of(r.attachment_paths||[])){const blob=await downloadAttachment(path);doc.addPage();header(doc,'ANEXO DO TRANSPORTE',r.patient_name);const pic=await pdfImage(blob);if(pic){bytes+=blob.size;attachments++;deletablePaths.push(path);const ratio=Math.min(186/pic.w,245/pic.h),w=pic.w*ratio,h=pic.h*ratio;doc.addImage(pic.data,'JPEG',12+(186-w)/2,34,w,h,undefined,'FAST')}else{doc.setTextColor(40);doc.text('Documento PDF original relacionado a este transporte.',12,38)}}}const start=$('dateStart').value,end=$('dateEnd').value,fileName='Arquivo_Transportes_HEURO_'+start+'_a_'+end;finishPdf(doc,fileName);archiveReady={data,ids:data.map(r=>r.id),paths:deletablePaths,bytes,attachments,fileName,start,end,statuses:[...new Set(data.map(statusOf))]};$('archiveConfirm').disabled=false;$('archiveMessage').innerHTML='<p class="notice">PDF gerado com sucesso. Abra e confira o arquivo antes de autorizar a remoção dos anexos.</p>'}catch(e){archiveReady=null;alert(e.message||'Falha ao gerar arquivo.')}finally{panel.classList.remove('loading')}}
async function removeStorage(paths){if(!paths.length)return;for(let i=0;i<paths.length;i+=500){const batch=paths.slice(i,i+500),res=await fetch(app.apiUrl('/storage/v1/object/transport-attachments'),{method:'DELETE',headers:auth(),body:JSON.stringify({prefixes:batch})});if(!res.ok){const data=await res.json().catch(()=>null);throw new Error(data?.message||'Falha ao remover anexos do armazenamento.')}}}
async function finalizeArchive(){if(!archiveReady||!$('archiveConfirm').checked)return;if(!confirm('Esta ação removerá permanentemente os anexos originais já incluídos no PDF. Os dados do histórico serão preservados. Continuar?'))return;const panel=$('archivePanel');try{panel.classList.add('loading');await removeStorage(archiveReady.paths);await fetchJson('/rest/v1/rpc/admin_finalize_transport_archive',{method:'POST',body:JSON.stringify({p_request_ids:archiveReady.ids,p_period_start:archiveReady.start,p_period_end:archiveReady.end,p_status_filter:archiveReady.statuses,p_file_name:archiveReady.fileName+'.pdf',p_attachment_count:archiveReady.attachments,p_freed_bytes:archiveReady.bytes,p_deleted_paths:archiveReady.paths})});alert('Arquivamento concluído. Os dados permanecem no histórico e somente as imagens incorporadas foram removidas.');archiveReady=null;await load()}catch(e){alert(e.message||'Não foi possível concluir o arquivamento.')}finally{panel.classList.remove('loading')}}
function populateSelect(id,values){const select=$(id),current=select.value;select.innerHTML='<option value="all">Todos</option>'+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if([...select.options].some(o=>o.value===current))select.value=current}
async function load(){document.body.classList.add('loading');try{const[data,logs]=await Promise.all([fetchJson('/rest/v1/transport_requests?select=*,transport_executions(*),transport_execution_events(*)&order=created_at.desc'),fetchJson('/rest/v1/transport_archives?select=*&order=created_at.desc&limit=50')]);requests=Array.isArray(data)?data:[];archives=Array.isArray(logs)?logs:[];populateSelect('sectorFilter',requests.map(r=>r.origin_sector));populateSelect('professionalFilter',requests.map(r=>executionOf(r)?.responsible_name));applyFilters()}catch(e){alert(e.message)}finally{document.body.classList.remove('loading')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('applyFilters').onclick=applyFilters;setDefaults();showTab(['historico','relatorios','arquivar'].includes(location.hash.slice(1))?location.hash.slice(1):'historico');load();
})();
