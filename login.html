<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062e86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json?v=20260806.57">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="stylesheet" href="css/style.css?v=20260806.57">
</head>
<body>
  <main class="app-shell">
    <section class="app-screen login-screen" aria-label="Login do Transporte HEURO">
      <img class="app-screen__image" src="158A451E-5AF3-4084-A1C5-BD934F34F3EC.png?v=20260806.57" alt="Tela de login do Transporte HEURO">
      <form id="loginForm" novalidate>
        <input id="loginIdentifier" class="login-control login-control--identifier" type="text" autocomplete="username" placeholder=" " aria-label="E-mail ou CPF" required>
        <input id="loginPassword" class="login-control login-control--password" type="password" autocomplete="current-password" placeholder=" " aria-label="Senha" required>
        <button id="togglePassword" class="hotspot login-screen__toggle" type="button" aria-label="Mostrar ou ocultar senha"></button>
        <button class="hotspot login-screen__submit" type="submit" aria-label="Entrar no sistema"></button>
      </form>
      <a id="forgotPasswordLink" class="hotspot login-screen__forgot" href="./recuperar-senha.html" aria-label="Esqueci minha senha"></a>
      <a id="firstRegistrationLink" class="hotspot login-screen__register" href="./cadastro.html" aria-label="Realizar primeiro cadastro"></a>
    </section>
  </main>
  <script src="js/config.js?v=20260806.57"></script>
  <script src="js/app.js?v=20260806.57" defer></script>
</body>
</html>
