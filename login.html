<body>

    <img class="app-screen__image" src="158A451E-5AF3-4084-A1C5-BD934F34F3EC.png?v=20260806.63" alt="Tela de login do Transporte HEURO">
    <form id="loginForm" novalidate><input id="loginIdentifier" class="login-control login-control--identifier" type="text" autocomplete="username" placeholder=" " aria-label="E-mail ou CPF" required><input id="loginPassword" class="login-control login-control--password" type="password" autocomplete="current-password" placeholder=" " aria-label="Senha" required><button id="togglePassword" class="hotspot login-screen__toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg class="password-eye password-eye--hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9.4 5.2 9.4 5.2a13.8 13.8 0 0 1-3.1 3.6M6.6 6.6a15.7 15.7 0 0 0-4 4.2S6.5 16 12 16c1.1 0 2.1-.2 3-.5"/></svg><svg class="password-eye password-eye--visible" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 12S6.5 6.8 12 6.8 21.4 12 21.4 12 17.5 17.2 12 17.2 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="2.8"/></svg></button><button class="hotspot login-screen__submit" type="submit" aria-label="Entrar no sistema"><span class="press-feedback" aria-hidden="true"></span></button></form>
