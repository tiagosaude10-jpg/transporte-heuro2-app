<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062e86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Login — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="stylesheet" href="css/style.css?v=20260806.3">
  <style>
    .forgot-password-link{position:absolute;z-index:12;left:30%;right:30%;top:62.7%;height:3.6%;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.94);border:2px solid rgba(15,79,170,.35);box-shadow:0 4px 12px rgba(0,36,100,.15);color:#123f91;font:800 clamp(12px,3.2vw,16px)/1 system-ui,-apple-system,sans-serif;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .forgot-password-link:active,.forgot-password-link.is-pressed{background:#e8f1ff;border-color:#0b63ce;box-shadow:0 0 0 4px rgba(11,99,206,.16);transform:scale(.98)}
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="app-screen login-screen" aria-label="Login do Transporte HEURO">
      <img class="app-screen__image" src="544AB6B5-F264-4518-A2AE-1A3679A7EB68.png?v=20260806.3" alt="Tela de login do Transporte HEURO">
      <form id="loginForm" novalidate>
        <input id="loginIdentifier" class="login-control login-control--identifier" type="text" autocomplete="username" placeholder="Digite seu e-mail ou CPF" aria-label="E-mail ou CPF" required>
        <input id="loginPassword" class="login-control login-control--password" type="password" autocomplete="current-password" placeholder="Digite sua senha" aria-label="Senha" required>
        <button id="togglePassword" class="hotspot login-screen__toggle" type="button" aria-label="Mostrar ou ocultar senha"></button>
        <button class="hotspot login-screen__submit" type="submit" aria-label="Entrar no sistema"></button>
      </form>
      <a id="forgotPasswordLink" class="forgot-password-link" href="./recuperar-senha.html" aria-label="Esqueci minha senha">Esqueci minha senha</a>
      <a id="firstRegistrationLink" class="hotspot login-screen__register" href="./cadastro.html" aria-label="Realizar primeiro cadastro"></a>
    </section>
  </main>
  <script src="js/config.js?v=20260806.3"></script>
  <script src="js/app.js?v=20260806.3" defer></script>
</body>
</html>
