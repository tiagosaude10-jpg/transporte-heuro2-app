<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0759c7">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Assumir plantão — HEURO</title>
  <link rel="stylesheet" href="css/equipe-plantao-v95.css?v=20260808.100">
  <link rel="stylesheet" href="css/equipe-plantao-v98.css?v=20260808.100">
  <link rel="stylesheet" href="css/bottom-navigation-v89.css?v=20260808.100">
</head>
<body>
  <main class="shift-page">
    <header class="shift-header">
      <a class="back" href="./comando.html?v=20260808.100" aria-label="Voltar">←</a>
      <div><p>HEURO TRANSPORTES</p><h1>Equipe do Plantão</h1><span>Toque na sua categoria no veículo do plantão.</span></div>
    </header>

    <section class="shift-day" aria-label="Plantão vigente">
      <span>Plantão vigente · 07h às 07h</span>
      <strong id="shiftDateLabel">Carregando...</strong>
      <small>A escala administrativa e a entrada espontânea funcionam juntas.</small>
    </section>

    <section id="identityCard" class="identity-card" aria-live="polite"></section>
    <section id="statusBanner" class="status-banner" role="status">Verificando o plantão...</section>
    <section id="entryPanel" class="duration-choice entry-panel" aria-labelledby="entryTitle" hidden>
      <div><span>Entrada no plantão</span><strong id="entryTitle">Categoria e veículo</strong><small id="entrySubtitle">Escolha o turno e confirme sua entrada.</small></div>
      <div class="duration-options">
        <label class="hours-12-day"><input type="radio" name="shiftPeriod" value="12h_diurno"><span><b>12h diurno</b><small>07h às 19h</small></span></label>
        <label class="hours-12-night"><input type="radio" name="shiftPeriod" value="12h_noturno"><span><b>12h noturno</b><small>19h às 07h</small></span></label>
        <label class="hours-24"><input type="radio" name="shiftPeriod" value="24h"><span><b>24 horas</b><small>07h às 07h</small></span></label>
      </div>
      <div class="entry-actions"><button id="cancelEntry" type="button" class="entry-cancel">Cancelar</button><button id="confirmEntry" type="button" class="entry-confirm">Confirmar entrada</button></div>
    </section>
    <section id="vehicleCards" class="vehicle-list" aria-live="polite"></section>
    <p id="message" class="message" role="alert" hidden></p>
  </main>
  <script src="js/config.js?v=20260808.100"></script>
  <script src="js/equipe-plantao-v95.js?v=20260808.100" defer></script>
  <script src="js/bottom-navigation-v89.js?v=20260808.100" defer></script>
</body>
</html>
