<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Tela de comando — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .command-screen{position:fixed;inset:0;background:#fff}
    .command-screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}

    /* Área invisível exatamente sobre o botão “Mais” da barra inferior. */
    .admin-hotspot{
      position:fixed;
      z-index:2147483647;
      right:0;
      bottom:0;
      width:24%;
      height:13%;
      min-width:82px;
      min-height:76px;
      display:block;
      background:transparent;
      border:0;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      pointer-events:auto;
    }
    .admin-hotspot:active{
      background:rgba(7,91,216,.10);
      box-shadow:inset 0 0 0 2px rgba(7,91,216,.22);
    }
  </style>
</head>
<body>
  <main class="command-screen" aria-label="Tela de comando do HEURO Transportes">
    <img src="2AEAA123-F06C-4518-A2AE-1A3679A7EB68.png" alt="Tela de comando do HEURO Transportes" hidden>
    <img src="2AEAA123-F06C-4510-A36B-F98600DFC210.png?v=40" alt="Tela de comando do HEURO Transportes">
    <a
      id="adminPanelLink"
      class="admin-hotspot"
      href="./admin-cadastros.html?v=40"
      aria-label="Abrir painel do administrador"
    ></a>
  </main>

  <script>
    (() => {
      let session = null;
      try { session = JSON.parse(localStorage.getItem('heuro_session') || 'null'); } catch (_) {}
      if (!session?.access_token) {
        window.location.replace('./login.html?v=40');
        return;
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
      }
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }
    })();
  </script>
</body>
</html>
