<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Tela de comando — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .command-screen{position:fixed;inset:0;background:#fff}
    .command-screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .screen-hotspot{position:fixed;z-index:2147483647;display:block;margin:0;padding:0;background:transparent;border:0;text-decoration:none;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;pointer-events:auto;cursor:pointer}
    .admin-hotspot{right:2.2%;bottom:1.1%;width:18%;height:9%;min-width:70px;min-height:60px;border-radius:18px}
    .logout-hotspot{right:0;top:0;width:32%;height:18%;min-width:110px;min-height:92px;border-radius:0 0 0 24px}
    .screen-hotspot:active,.screen-hotspot.is-pressed{background:rgba(7,91,216,.10);box-shadow:inset 0 0 0 2px rgba(7,91,216,.22)}
    .permission-dialog{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:rgba(3,18,58,.55)}
    .permission-dialog[hidden]{display:none}
    .permission-box{width:min(100%,390px);padding:24px;border-radius:22px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.28);text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#0b2f77}
    .permission-box h2{margin:0 0 10px;font-size:1.35rem}.permission-box p{margin:0 0 20px;line-height:1.45;color:#4d6085}.permission-box button{width:100%;min-height:52px;border:0;border-radius:14px;background:#0a55c4;color:#fff;font-weight:800;font-size:1rem}
  </style>
</head>
<body>
  <main id="commandScreen" class="command-screen" aria-label="Tela de comando do HEURO Transportes">
    <img src="2AEAA123-F06C-4510-A36B-F98600DFC210.png" alt="Tela de comando do HEURO Transportes">
    <a id="adminPanelLink" class="screen-hotspot admin-hotspot" href="./admin-cadastros.html" aria-label="Abrir painel do administrador"></a>
    <button id="logoutButton" class="screen-hotspot logout-hotspot" type="button" aria-label="Sair do sistema"></button>
  </main>

  <section id="permissionDialog" class="permission-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="permissionTitle">
    <div class="permission-box">
      <h2 id="permissionTitle">Acesso restrito</h2>
      <p id="permissionMessage">Você não possui permissão para acessar esta função.</p>
      <button id="permissionClose" type="button">Entendi</button>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/comando.js" defer></script>
</body>
</html>
