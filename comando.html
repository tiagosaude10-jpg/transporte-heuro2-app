<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Tela de comando — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="stylesheet" href="css/comando.css?v=20">
</head>
<body>
  <main class="command-shell">
    <section class="command-screen" aria-label="Tela de comando do HEURO Transportes">
      <img class="command-screen__image" src="2AEAA123-F06C-4510-A36B-F98600DFC210.png?v=20" alt="Tela de comando do HEURO Transportes">
    </section>
  </main>

  <button
    id="adminPanelButton"
    class="command-admin-button"
    type="button"
    aria-label="Abrir painel do administrador"
    onclick="window.location.assign('./admin-cadastros.html?v=20')"
  ></button>

  <script>
    (() => {
      let session = null;
      try { session = JSON.parse(localStorage.getItem('heuro_session') || 'null'); } catch (_) {}
      if (!session?.access_token) {
        window.location.replace('./login.html?v=20');
        return;
      }

      const button = document.getElementById('adminPanelButton');
      button.addEventListener('touchend', (event) => {
        event.preventDefault();
        window.location.assign('./admin-cadastros.html?v=20');
      }, { passive: false });

      button.addEventListener('pointerup', (event) => {
        event.preventDefault();
        window.location.assign('./admin-cadastros.html?v=20');
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((items) => items.forEach((item) => item.unregister()));
      }
      if ('caches' in window) {
        caches.keys().then((names) => names.forEach((name) => caches.delete(name)));
      }
    })();
  </script>
</body>
</html>
