  <style>
    *{box-sizing:border-box}:root{--app-height:100dvh;--command-nav-space:calc(var(--heuro-bottom-nav-height,94px) + env(safe-area-inset-bottom))}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .command-screen{position:fixed;inset:0 0 var(--command-nav-space);display:grid;place-items:start center;background:#fff;overflow:hidden}
    .command-stage{position:relative;width:var(--command-stage-width,96vw);height:auto;aspect-ratio:862/1825;overflow:hidden}
    .command-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .command-image-main{clip-path:inset(0 0 25.2% 0)}

    .hotspot{position:absolute;z-index:20;display:block;border:0;text-decoration:none;background:transparent;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,background .12s ease}

    .request{left:5.2%;top:28.2%;width:89.5%;height:15.1%;border-radius:24px}.team{left:5.2%;top:44.9%;width:89.5%;height:15%;border-radius:24px}.shift{left:5.2%;top:61.6%;width:89.5%;height:13%;border-radius:24px}.logout{left:71%;top:4.1%;width:23%;height:4.8%;border-radius:12px}
    .user-name{position:absolute;z-index:15;left:17.2%;top:13.2%;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font:900 clamp(15px,4vw,27px)/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-shadow:0 2px 5px rgba(0,20,75,.45);pointer-events:none}
    .summary-value{position:absolute;z-index:16;top:85.09%;width:12%;height:2.54%;display:grid;place-items:center;color:#071d57;font:900 clamp(14px,4.3vw,28px)/1 system-ui,-apple-system,"Segoe UI",sans-serif;pointer-events:none}.summary-requested{left:13.4%}.summary-active{left:35.3%}.summary-pending{left:57.3%}.summary-completed{left:79.2%}
    .notice{position:fixed;z-index:2147483500;left:50%;top:50%;width:min(88%,390px);transform:translate(-50%,-50%);padding:22px;border:0;border-radius:22px;background:#fff;box-shadow:0 20px 70px rgba(0,25,75,.32);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17365f}.notice[hidden]{display:none}.notice h2{margin:0 0 8px;color:#073d9d;font-size:1.25rem}.notice p{margin:0 0 18px;line-height:1.45}.notice button{width:100%;min-height:50px;border:0;border-radius:14px;background:#0759c7;color:#fff;font:inherit;font-weight:850}
  </style>

<body>

    <img class="command-image command-image-summary" src="29BAFC3A-377C-49E7-B60A-A4D47176F7CC.png?v=20260808.92" alt="" aria-hidden="true">
