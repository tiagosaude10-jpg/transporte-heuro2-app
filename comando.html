<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <title>Tela de comando — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <link rel="stylesheet" href="css/comando.css?v=4">
</head>
<body>
  <main class="command-shell">
    <section class="command-screen" aria-label="Tela de comando do HEURO Transportes">
      <img
        class="command-screen__image"
        src="2AEAA123-F06C-4510-A36B-F98600DFC210.png"
        alt="Tela de comando do HEURO Transportes"
      >
      <a
        id="adminPanelLink"
        class="command-hotspot command-admin-hotspot"
        href="admin-cadastros.html"
        data-required-access="administrador_geral"
        aria-label="Abrir painel do administrador"
      ></a>
    </section>
  </main>

  <div id="permissionDialog" class="permission-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="permissionTitle">
    <div class="permission-dialog__card">
      <div class="permission-dialog__icon" aria-hidden="true">!</div>
      <h2 id="permissionTitle">Acesso não autorizado</h2>
      <p id="permissionMessage">Você não possui permissão para acessar esta função.</p>
      <button id="permissionClose" type="button">Entendi</button>
    </div>
  </div>

  <script src="js/comando.js?v=2" defer></script>
</body>
</html>
