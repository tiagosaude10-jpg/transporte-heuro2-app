<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HEURO Transportes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Tela de comando — HEURO Transportes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="A5B6B48E-DCCE-4B36-9A5F-F7C1D1225E82.png">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .command-screen{position:fixed;inset:0;background:#fff}
    .command-screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .admin-test-link{position:fixed;z-index:2147483647;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:180px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:center;background:#075bd8;color:#fff;text-decoration:none;font:900 18px/1 system-ui,-apple-system,sans-serif;box-shadow:0 8px 24px rgba(0,45,130,.35);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .admin-test-link:active{transform:translateX(-50%) scale(.96);background:#0347ad}
  </style>
</head>
<body>
  <main class="command-screen" aria-label="Tela de comando do HEURO Transportes">
    <img src="2AEAA123-F06C-4510-A36B-F98600DFC210.png?v=30" alt="Tela de comando do HEURO Transportes">
  </main>

  <a class="admin-test-link" href="./admin-cadastros.html?v=30">ADMIN</a>

  <script>
    (() => {
      let session = null;
      try { session = JSON.parse(localStorage.getItem('heuro_session') || 'null'); } catch (_) {}
      if (!session?.access_token) window.location.replace('./login.html?v=30');
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
      if ('caches' in window) caches.keys().then(names => names.forEach(name => caches.delete(name)));
    })();
  </script>
</body>
</html>
